.empty{color:var(--muted);padding:30px 0}

.info .big{font-size:44px;text-align:center;padding:14px 0 6px}
.info dl{padding:6px 14px 14px}

.rel{margin-top:26px}

.rel a:hover{border-color:var(--green)}
footer{max-width:1040px;margin:0 auto;padding:0 20px 40px;color:#7f927f;font-size:12px}

.go{padding:0 22px;border:2px solid var(--green);background:#2b5d2e;color:#fff;border-radius:8px;font:800 13px Inter,sans-serif;cursor:pointer}
.go:hover{background:#357a38}
.answ{margin:22px 0 8px}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;background:linear-gradient(145deg,var(--panel2),var(--panel));border:2px solid #38533c;box-shadow:5px 5px 0 #050805;padding:20px}
.ans.noimg{grid-template-columns:1fr}
.ans-i{width:190px;max-width:100%;max-height:230px;object-fit:contain;background:#0a120c;border:2px solid #2b4530;align-self:start}
.ans-k{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.ans h2{font-family:"Press Start 2P",monospace;font-size:14px;line-height:1.5;margin:8px 0 12px}
.ans p{max-width:70ch;margin-bottom:10px;font-size:14.5px}
.ans p.ans-n{color:var(--gold);font-size:13px}
.ans p.ans-s{color:#7f927f;font-size:11.5px;margin:14px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn{display:inline-block;padding:9px 14px;border:2px solid #2b4530;border-radius:8px;background:var(--panel);font-size:13px;font-weight:700;text-decoration:none}
.btn:hover{border-color:var(--green)}
.btn.pri{background:#2b5d2e;border-color:var(--green)}
.ans-o{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans-o>span{font-size:12px;color:var(--muted);font-weight:700}
.ans-load{color:var(--muted);padding:18px 0}
.sec{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);margin:6px 0 14px}
@media(max-width:620px){.ans{grid-template-columns:1fr}.ans-i{width:100%;max-height:200px}.sr{flex-wrap:wrap}.go{padding:12px 22px}}

const hp=h=>typeof h==='number'?h+' ('+h/2+' hearts)':h;
MOBS.forEach(m=>have.has(m[0])||D.push(["Mobs",m[0],m[1],m[4],[["Health",hp(m[3])],["Behavior",m[2]]]]));
BLK.forEach(b=>have.has(b[0])||D.push(["Blocks",b[0],b[1],b[2],[["Key fact",b[3]]]]));
ITM.forEach(i=>have.has(i[0])||D.push(["Items",i[0],i[1],i[2],[["Type","Item"]]]));
ENC.forEach(e=>have.has(e[0])||D.push(["Enchantments",e[0],"✨",e[3],[["Max level",e[1]],["Applies to",e[2]]]]));
const CATS=["All","Mobs","Blocks","Ores","Items","Enchantments","Food","Redstone","Biomes","Dimensions","Structures","Guides","Commands"];
const app=document.getElementById('app');
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cat='All', query='';
(function(){const p=new URLSearchParams(location.search);const c=p.get('c');if(c&&['Mobs','Blocks','Ores','Items','Enchantments','Food','Redstone','Biomes','Dimensions','Structures','Guides','Commands'].includes(c))cat=c;query=(p.get('q')||'').slice(0,60);})();

/* ---- Ask Wikipedia first, then show Minehub pages ---- */
const WP='https://en.wikipedia.org/w/api.php';
function clean(q){
  let t=q.trim().replace(/[?!.]+$/,''); const before=t;
  t=t.replace(/^(please\s+)?(tell me (more )?about|explain|define|describe|look up|search for|find|show me)\s+/i,'');
  t=t.replace(/^(what|who|whom|where|when|why|which|how)\s+(is|are|was|were|does|do|did|can|could|would|should)\s+/i,'');
  t=t.replace(/^(a|an|the)\s+/i,'').replace(/\s+(mean|means)$/i,'');
  return t.trim()||before;
}
async function wpSearch(q,signal){
  const u=WP+'?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=5&gsrsearch='+encodeURIComponent(q)
   +'&prop=extracts|pageimages|info|pageprops&exintro=1&explaintext=1&exsentences=6&exlimit=max&piprop=thumbnail&pithumbsize=480&inprop=url&ppprop=disambiguation';
  const r=await fetch(u,{signal}); if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json(), p=j.query&&j.query.pages?Object.values(j.query.pages):[];
  return p.sort((x,y)=>x.index-y.index);
}
async function wpSuggest(q,signal){
  const r=await fetch(WP+'?action=query&format=json&origin=*&list=search&srinfo=suggestion&srlimit=1&srsearch='+encodeURIComponent(q),{signal});
  const j=await r.json(); return (j.query&&j.query.searchinfo&&j.query.searchinfo.suggestion)||'';
}
let seq=0,timer=null,ctl=null,S=null;
const isDis=p=>!!(p.pageprops&&('disambiguation' in p.pageprops));
const wpUrl=p=>/^https:\/\/en\.wikipedia\.org\//.test(p.fullurl||'')?p.fullurl:'https://en.wikipedia.org/wiki/'+encodeURIComponent(p.title.replace(/ /g,'_'));
function syncUrl(raw){
  try{const u=new URLSearchParams(location.search); if(raw)u.set('q',raw.slice(0,60)); else u.delete('q');
    const qs=u.toString(); history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);}catch(e){}
}
function ask(raw){
  clearTimeout(timer);
  const box=document.getElementById('ans'); if(!box) return;
  if(ctl) ctl.abort();
  raw=(raw||'').trim(); const q=clean(raw);
  if(q.length<2){seq++;box.hidden=true;box.innerHTML='';syncUrl('');return;}
  syncUrl(raw);
  const my=++seq, c=new AbortController(); ctl=c;
  box.hidden=false; box.innerHTML='<p class="ans-load">Searching Wikipedia for “'+esc(q)+'”…</p>';
  (async()=>{
    try{
      let used=q, fixed='', res=await wpSearch(q,c.signal);
      if(!res.length&&raw!==q){used=raw;res=await wpSearch(raw,c.signal);}
      if(!res.length){const sg=await wpSuggest(q,c.signal); if(sg){fixed=sg;used=sg;res=await wpSearch(sg,c.signal);}}
      if(my!==seq) return;
      S={q:used,res:res,fixed:fixed,raw:q};
      paint(res.find(p=>!isDis(p)&&p.extract)||res[0]);
    }catch(e){
      if(e.name==='AbortError'||my!==seq) return;
      box.innerHTML='<div class="ans noimg"><div><div class="ans-k">Wikipedia</div><h2>Could not reach Wikipedia</h2><p>Check your internet connection and try again. Minehub pages are still listed below.</p><div class="acts"><button class="btn pri" type="button" data-retry="1">Try again</button></div></div></div>';
    }
  })();
}
function paint(main){
  const box=document.getElementById('ans'); if(!box||!S) return;
  const q=S.q, res=S.res, mc='https://minecraft.wiki/w/Special:Search?search='+encodeURIComponent(q);
  if(!res.length||!main){
    box.innerHTML='<div class="ans noimg"><div><div class="ans-k">Wikipedia</div><h2>No answer found</h2><p>Wikipedia has nothing for “'+esc(q)+'”. Try different words, or look it up on the Minecraft Wiki.</p><div class="acts"><a class="btn pri" href="'+mc+'" target="_blank" rel="noopener noreferrer">Search Minecraft Wiki ↗</a></div></div></div>';
    return;
  }
  const img=main.thumbnail&&/^https:\/\/upload\.wikimedia\.org\//.test(main.thumbnail.source)?main.thumbnail.source:'';
  const paras=(main.extract||'No summary is available for this page.').split(/\n+/).filter(Boolean).slice(0,3).map(x=>'<p>'+esc(x)+'</p>').join('');
  const loc=D.find(e=>[q,main.title].some(n=>e[1].toLowerCase()===n.toLowerCase()));
  const others=res.filter(x=>x!==main);
  let h='<div class="ans'+(img?'':' noimg')+'">'+(img?'<img class="ans-i" src="'+esc(img)+'" alt="" loading="lazy">':'')+'<div><div class="ans-k">From Wikipedia</div><h2>'+esc(main.title)+'</h2>';
  if(S.fixed) h+='<p class="ans-n">Showing results for “'+esc(S.fixed)+'” instead of “'+esc(S.raw)+'”.</p>';
  if(isDis(res[0])) h+='<p class="ans-n">“'+esc(q)+'” can mean several things. Pick another match below if this is not the one.</p>';
  h+=paras+'<div class="acts"><a class="btn pri" href="'+esc(wpUrl(main))+'" target="_blank" rel="noopener noreferrer">Read the full article ↗</a>'
    +'<a class="btn" href="'+mc+'" target="_blank" rel="noopener noreferrer">Search Minecraft Wiki instead ↗</a>'
    +(loc?'<a class="btn" href="#/'+slug(loc[1])+'">Open Minehub page: '+esc(loc[1])+'</a>':'')+'</div>';
  if(others.length) h+='<div class="ans-o"><span>Other matches:</span>'+others.map(x=>'<button class="chip" type="button" data-i="'+res.indexOf(x)+'">'+esc(x.title)+'</button>').join('')+'</div>';
  h+='<p class="ans-s">Text from Wikipedia, available under CC BY-SA 4.0.</p></div></div>';
  box.innerHTML=h;
}
function home(){
  document.title='Minehub Wiki — Ask Anything, Minecraft Mobs, Blocks & Guides';
  app.innerHTML='<h1>MINEHUB<span> WIKI</span></h1><p class="lead">Ask anything. Minehub Wiki checks Wikipedia first and shows the answer right here, then lists matching Minecraft pages below.</p>'
   +'<div class="sr"><input id="q" type="search" placeholder="Ask anything… try “crystal” or “who invented TNT?”" aria-label="Ask anything" autocomplete="off"><button id="go" class="go" type="button">Ask</button></div>'
   +'<div class="answ" id="ans" hidden aria-live="polite"></div>'
   +'<div class="chips" id="chips"></div><h2 class="sec">Minehub Wiki pages</h2><div class="grid" id="list" aria-live="polite"></div>';
  const q=document.getElementById('q'); q.value=query;
  q.addEventListener('input',()=>{
    query=q.value; list(); clearTimeout(timer);
    if(clean(query).length>=3) timer=setTimeout(()=>ask(query),650); else ask('');
  });
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)ask(q.value);});
  document.getElementById('go').addEventListener('click',()=>ask(q.value));
  document.getElementById('ans').addEventListener('click',e=>{
    const r=e.target.closest('[data-retry]'); if(r){ask(q.value);return;}
    const b=e.target.closest('[data-i]'); if(b&&S){paint(S.res[+b.dataset.i]);}
  });
  document.getElementById('chips').innerHTML=CATS.map(c=>'<button class="chip" type="button" data-c="'+c+'" aria-pressed="'+(c===cat)+'">'+c+'</button>').join('');
  document.getElementById('chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b)return; cat=b.dataset.c;
    document.querySelectorAll('#chips .chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===cat));
    list();
  });
  list();
  if(clean(query).length>=2) ask(query);
}
function list(){
  const raw=query.trim().toLowerCase(), t=(clean(raw)||raw).toLowerCase();
  const pick=w=>D.filter(e=>(cat==='All'||e[0]===cat)&&(!w||(e[1]+' '+e[3]).toLowerCase().includes(w)));
  let r=pick(t); if(!r.length&&raw) r=pick(raw);
  document.getElementById('list').innerHTML=r.length?r.map(e=>
    '<a class="card" href="#/'+slug(e[1])+'"><div class="ic" aria-hidden="true">'+e[2]+'</div><h3>'+esc(e[1])+'</h3><p>'+esc(e[3])+'</p><span class="cat">'+e[0]+'</span></a>').join('')
    :'<p class="empty">'+(query.trim()?'No Minehub pages match “'+esc(query)+'”. Check the Wikipedia answer above or try another word.':'No pages in this category yet.')+'</p>';
}
function article(s){
  const e=D.find(x=>slug(x[1])===s);
  if(!e){app.innerHTML='<p class="empty">That page does not exist yet. <a href="#/">Go back to the wiki home</a>.</p>';return;}
  document.title=e[1]+' — Minehub Wiki';
  const rel=D.filter(x=>x[0]===e[0]&&x!==e).slice(0,8);
  app.innerHTML='<div class="crumb"><a href="#/">Wiki</a> / '+e[0]+'</div><div class="art"><div><h1>'+esc(e[1])+'</h1><p>'+esc(e[3])+'</p>'
   +(e[5]?'<div class="tip">'+esc(e[5])+'</div>':'')
   +'<div class="rel"><h2>More in '+e[0]+'</h2>'+rel.map(x=>'<a href="#/'+slug(x[1])+'">'+x[2]+' '+esc(x[1])+'</a>').join('')+'</div></div>'
   +'<aside class="info" aria-label="Quick facts"><div class="t">'+esc(e[1])+'</div><div class="big" aria-hidden="true">'+e[2]+'</div><dl>'
   +e[4].map(f=>'<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>').join('')+'</dl></aside></div>';
  window.scrollTo(0,0);
}
function route(){const h=location.hash.replace(/^#\/?/,''); h?article(h):home();}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
